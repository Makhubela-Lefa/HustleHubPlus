$kind: http-request
url: https://localhost:3000/register
method: POST
body:
  type: json
  content: "{\r

    \  \"name\": \"Short Password Example\",\r

    \  \"email\": \"shortpassword@example.com\",\r

    \  \"password\": \"1234567\",\r

    \  \"role\": \"client\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Short password is rejected\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.success).to.eql(false);\r

      });\r

      \r

      pm.test(\"Password length message is returned\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.message).to.eql(\r

      \        \"Password must be at least 8 characters long.\"\r

      \    );\r

      });"
    language: text/javascript
