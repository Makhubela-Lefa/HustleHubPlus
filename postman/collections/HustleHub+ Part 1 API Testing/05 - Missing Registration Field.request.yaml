$kind: http-request
url: https://localhost:3000/register
method: POST
body:
  type: json
  content: "{\r

    \  \"name\": \"Missing Field User\",\r

    \  \"email\": \"missingfield@example.com\",\r

    \  \"password\": \"Password123\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Missing registration field is rejected\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.success).to.eql(false);\r

      });\r

      \r

      pm.test(\"Required fields message is returned\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.message).to.eql(\r

      \        \"Name, email, password and role are required.\"\r

      \    );\r

      });"
    language: text/javascript
