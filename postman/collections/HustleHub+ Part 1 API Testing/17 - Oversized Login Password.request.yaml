$kind: http-request
url: https://localhost:3000/login
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"postmanclient@example.com\",\r

    \  \"password\": \"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Oversized password is rejected\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.success).to.eql(false);\r

      });\r

      \r

      pm.test(\"Password size message is returned\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.message).to.eql(\"Password must not exceed 72 bytes.\");\r

      });"
    language: text/javascript
order: 4503597166588791
