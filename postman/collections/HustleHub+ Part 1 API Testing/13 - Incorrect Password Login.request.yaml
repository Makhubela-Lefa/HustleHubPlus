$kind: http-request
url: https://localhost:3000/login
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"clientTest@example.com\",\r

    \  \"password\": \"WrongPassword123\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 401\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"Incorrect password is rejected\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.success).to.eql(false);\r

      });\r

      \r

      pm.test(\"Generic credentials message is returned\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.message).to.eql(\"Invalid credentials.\");\r

      });"
    language: text/javascript
order: 4503479852332243
