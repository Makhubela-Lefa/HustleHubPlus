scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 404\", function () {\r

      \    pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test(\"Unknown route is handled safely\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.success).to.eql(false);\r

      });\r

      \r

      pm.test(\"Controlled not found message is returned\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.message).to.eql(\"Route not found.\");\r

      });"
